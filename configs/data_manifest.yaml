# configs/data_manifest.yaml
# =============================================================================
# Canonical registry of every data source under data/. Single source of truth
# for the data-layout standard: the auditor, setup, and sync scripts all read it.
# See docs/standards/DATA_LAYOUT_STANDARD.md for the full convention.
#
# Per-source fields:
#   location : external | raw | processed         (which top-level data/ subtree)
#   tier     : public | academic | controlled     (controlled/licensed => NEVER personal cloud)
#   class    : irreplaceable | regenerable_expensive | regenerable_cheap | public_redownloadable
#   aliases  : [old/non-canonical dir names the auditor should flag for rename]
#   version  : free-text provenance
#   acquire  : how to (re)obtain it
#   regenerate : command that rebuilds it (empty if not regenerable)
#   sync     : back this up to G drive? (auto-policy: true only for irreplaceable +
#              regenerable_expensive AND tier != controlled; explicit here so you can override)
#   notes    : license / DUA / caveats
# =============================================================================
version: 1
gdrive:
  remote: "genvarcla:"                       # rclone remote (Google Drive)
  base: "genomic-variant-classifier/data"    # path under the remote (the mirror root)

# ---------------------------------------------------------------------------
# STORAGE POLICY -- how much free space a run requires, and when to refuse.
#
# Added 2026-07-21. Until now these numbers existed only as three constants
# inside scripts/forensics/audit_disk_census.py, and scripts/maintenance/
# preflight_data_guard.py did not check free space at all -- so the guard whose
# job is to catch storage problems before a run could not catch the storage
# problem the machine had.
#
# Measured on 2026-07-21: C: is the ONLY fixed volume, 935.59 GiB, 83.50 free
# (8.925 per cent). data/ alone is 98.75 GiB -- larger than the free space, so
# there is no headroom to stage, duplicate or rebuild any large artifact in
# place. Below ten per cent free is where Windows behaviour degrades, and the
# test suite showed a 1.87x wall-clock range on identical code over nine runs.
#
# required = working_cache_gib + max(headroom_fraction * volume, headroom_min_gib)
#
# THREE SEVERITIES, so the gate informs long before it blocks:
#   free >= required          OK
#   hard_floor <= free < req  WARN  -- run proceeds; the margin is gone
#   free < hard_floor         FAIL  -- refuse; this is where runs corrupt
#
# A single threshold would have to choose between crying wolf and staying
# silent until it is too late. These numbers are POLICY and live here, not in
# code; scripts/forensics/audit_disk_census.py keeps its own copies so it can
# run standalone from any directory, and tests/unit/test_storage_guard.py
# fails if the two ever disagree.
# ---------------------------------------------------------------------------
storage:
  # CORRECTED 2026-07-30. The comment that stood here read "JEPA embedding cache
  # built during a full run" and was wrong in both directions: the JEPA cache is
  # a ONE-TIME artifact no training run builds, and 14.7 is the POOLED-ONLY
  # figure the JEPA design forbids. One constant had two meanings; they are
  # separated below. The VALUE is unchanged -- it is the general working space a
  # run needs, and it is what `required` is computed from.
  working_cache_gib: 14.7      # general working space for a run, beyond headroom
  #
  # THE JEPA EMBEDDING CACHE, in four configurations, so no reader can take a
  # figure without also taking the configuration it describes. Derived at
  # ROADMAP.md:969-974 for the 4,420,180-row cohort, float16, reference plus
  # alternate only, Nucleotide Transformer and ESM-2 only:
  #
  #   pooled,      full cohort      14.70 GB =  13.69 GiB   DESIGN FORBIDS pooled-only
  #   pooled,      trainable rows    5.70 GB =   5.31 GiB   also pooled, also forbidden
  #   token-level, full cohort     154.00 GB = 143.42 GiB   the eventual requirement
  #   token-level, trainable        59.27 GB =  55.20 GiB   DECIDED, build this first
  #
  # 1,701,217 / 4,420,180 = 0.38488; 154.00 GB x 0.38488 = 59.27 GB = 55.20 GiB.
  # Cross-checked against the pooled pair: 5.7 / 14.7 = 0.38776, agreeing to 0.003.
  #
  # THIS VALUE IS NOT PART OF THE RUN GATE. It is what the JEPA readiness census
  # reports. The census and the preflight guard now answer DIFFERENT QUESTIONS
  # and will give different verdicts on the same volume -- on purpose.
  jepa_embedding_cache_gib: 55.2
  headroom_fraction: 0.05      # of total volume size
  headroom_min_gib: 20.0       # floor on the headroom term
  hard_floor_gib: 25.0         # below this, refuse outright
  warn_below_percent_free: 10.0  # advisory: Windows degrades under ten per cent

sources:
  # ---- EXTERNAL: third-party reference data (read-only inputs) ----
  clinvar:
    location: external
    tier: public
    class: public_redownloadable
    aliases: [clinvar_fresh]
    version: "GRCh38 2024-07"
    acquire: "NCBI ClinVar VCF -- https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/"
    regenerate: ""
    sync: false
    notes: "Public; re-downloadable. Large; regenerate rather than back up."
  gnomad:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "v4.1 exomes"
    acquire: "gnomAD downloads -- https://gnomad.broadinstitute.org/downloads"
    regenerate: ""
    sync: false
    notes: "Public; very large; re-downloadable."
  gtex:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "v11 gene median TPM (GCT)"
    acquire: "https://gtexportal.org/home/downloads/adult-gtex (GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_gene_median_tpm.gct.gz)"
    regenerate: ""
    sync: false
    notes: "Public reference (healthy tissue) -- leakage-safe."
  1kgp:
    location: external
    tier: public
    class: public_redownloadable
    aliases: [1000g, onekg, 1000genomes]
    version: "GRCh38 AF"
    acquire: "1000 Genomes Project -- https://www.internationalgenome.org/data"
    regenerate: ""
    sync: false
    notes: "kg_grch38_af.parquet is small + tracked in git."
  ensembl:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: ""
    acquire: "Ensembl / VEP -- https://www.ensembl.org/info/data/ftp/"
    regenerate: ""
    sync: false
    notes: "Gene annotations / VEP cache. CONFIRM exact contents + version."
  reference:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "GRCh38 primary assembly (Ensembl)"
    acquire: "Ensembl -- Homo_sapiens.GRCh38.dna.primary_assembly.fa(.gz) + samtools faidx for .fai"
    regenerate: ""
    sync: true
    notes: "Reference genome FASTA. Read form: the UNCOMPRESSED data/external/reference/Homo_sapiens.GRCh38.dna.primary_assembly.fa (+ .fai), opened by seq_windows.open_reference (pyfaidx, rebuild=False) in populate_fasta_seq. The redundant unindexed .fa.gz (841MB Ensembl download form; pyfaidx cannot read plain gzip) was dropped 2026-06-17 to reclaim disk. CODE-REFERENCED -- do NOT rename. Distinct from the top-level data/reference/ schema dir. Public but slow to re-download (~3GB) -- consider sync:true now."
  gencode:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "release 50 (GRCh38)"
    acquire: "GENCODE -- https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/"
    regenerate: ""
    sync: false
    notes: "Acquired 2026-06-17 with the publisher own per-file manifest (GENCODE_v50_manifest.json: url, bytes, SHA-256) and a validation report; all five digests RE-VERIFIED against disk 2026-08-30. Five artifacts: annotation GTF and GFF3, plus THREE transcript FASTA products (transcripts, pc_transcripts, lncRNA_transcripts) which are the sole remaining subject of ARTIFACT-KEY-INSUFFICIENT-1 -- one authority, one release, one assembly, one artifact kind, three distinct scientific products. This entry governs the SOURCE and does NOT resolve that artifact-product identity. MEASURED 2026-08-30: no module under src/ opens a GENCODE file; scripts/audit_source_data_assets.py and scripts/validate_gencode_assets.py audit or validate them. The same release directory also publishes GRCh38 genome FASTA, so the undeclared data/external/grch38 may be GENCODE-sourced -- measure its consumers before declaring or moving it."
  dbnsfp:
    location: external
    tier: academic
    class: public_redownloadable
    aliases: []
    version: "4.x"
    acquire: "https://www.dbnsfp.org/ (academic license)"
    regenerate: ""
    sync: false
    notes: "Academic license. Confirm terms before any cloud copy."
  spliceai:
    location: external
    tier: public
    class: public_redownloadable
    aliases: [spliceai_scores]
    version: "precomputed SNV"
    acquire: "Illumina SpliceAI precomputed scores (Basespace/Zenodo)."
    regenerate: ""
    sync: false
    notes: ""
  alphamissense:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "hg38"
    acquire: "https://zenodo.org/records/8208688 (AlphaMissense)"
    regenerate: ""
    sync: false
    notes: "CC BY-NC-SA 4.0 (non-commercial)."
  string:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "v12.0 (9606)"
    acquire: "https://string-db.org/cgi/download"
    regenerate: ""
    sync: false
    notes: ""
  reactome:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "ReactomePathways.gmt"
    acquire: "https://reactome.org/download-data"
    regenerate: "python scripts/build_reactome_parquet.py --gmt data/external/reactome/ReactomePathways.gmt --out data/external/reactome_gene_pathways.parquet"
    sync: false
    notes: "GMT is small; the built reactome_gene_pathways.parquet is regenerable_expensive (see below)."
  finngen:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: "R12"
    acquire: "https://www.finngen.fi/en/access_results"
    regenerate: ""
    sync: false
    notes: ""
  rnaseq:
    location: external
    tier: review
    class: irreplaceable
    aliases: []
    version: "user-supplied matrix"
    acquire: "Your own gene/transcript x sample quantification, OR recount3/ARCHS4."
    regenerate: "python scripts/build_rnaseq_parquet.py --matrix <matrix> [--tx-map ..] [--sample-meta ..] --out data/external/rnaseq_gene_expression.parquet"
    sync: true
    notes: "If your OWN cohort -> irreplaceable, back up. CONFIRM tier: a disease cohort may be controlled-access (then sync:false)."
  revel:
    location: external
    tier: public
    class: public_redownloadable
    aliases: []
    version: ""
    acquire: "https://sites.google.com/site/revelgenomics/"
    regenerate: ""
    sync: false
    notes: ""
  eve:
