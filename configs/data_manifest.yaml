  validation_cohort:
    location: external
    tier: review
    class: irreplaceable
    aliases: []
    version: ""
    acquire: "Project-internal."
    regenerate: ""
    sync: true
    notes: "CONFIRM tier + whether it is independent of the label cohort (leakage)."
  # ---- CONTROLLED / LICENSED -- NEVER sync to a personal Google Drive ----
  omim:
    location: external
    tier: controlled
    class: irreplaceable
    aliases: []
    version: ""
    acquire: "https://omim.org/ (institutional license)"
    regenerate: ""
    sync: false
    notes: "LICENSED. Do NOT place on personal cloud."
  hgmd:
    location: external
    tier: controlled
    class: irreplaceable
    aliases: [hgmd_pro]
