    sync: true
    notes: "Built artifact (data/external/reactome_gene_pathways.parquet). Path is code-referenced -- do NOT move."
  gtex_gene_expression:
    location: external
    tier: public
    class: regenerable_expensive
    aliases: []
    version: "built parquet"
    acquire: ""
    regenerate: 'python scripts/build_gtex_parquet.py --gct "G:/My Drive/genomic-variant-data/external/gtex/GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_gene_median_tpm.gct.gz" --out data/processed/gtex/gtex_v11_gene_expression.parquet'
