# pyproject.toml
# PEP 621 packaging metadata for genomic-variant-classifier.
#
# Replaces setup.py as part of the C1-C5 consolidate-package-layout migration
# (C2 step). See docs/hypotheses/HYP_consolidate-package-layout.md.
#
# Runtime dependencies remain in requirements.txt / requirements-api.txt /
# requirements-dev.txt (managed via pip-compile). Pre-migration setup.py had
# no install_requires; this preserves that. Migration to [project.dependencies]
# is possible at C5 audit but is not required for C2.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-variant-classifier"
version = "0.1.0"
description = "Ensemble ML system for pathogenic variant classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Monzia Moodie", email = "monzia.moodie@gmail.com" },
]

[project.urls]
Homepage = "https://github.com/monzia-moodie/genomic-variant-classifier"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genomic_variant_classifier*"]
namespaces = true

[tool.pytest.ini_options]
# Restrict pytest auto-discovery to tests/. Without this, pytest walks the
# entire rootdir and imports src/genomic_variant_classifier/agent_layer/
# test_message_bus.py during collection. That file's module-level code at
# L87-89 stubs sys.modules["torch"] = MagicMock() (and shap/ewc_utils/etc.),
# which pollutes torch for the remainder of the collection, causing scipy.
# stats's array_api_compat._issubclass_fast(ndarray, "torch", "Tensor") to
# return a MagicMock instead of torch.Tensor and raise TypeError on the
# downstream issubclass() check. See:
#   docs/incidents/INCIDENT_2026-05-26_scipy-torch-array-api-compat.md
# The agent_layer integration test is designed as a standalone script
# (per its docstring L10-14: "Run from agent_layer/: python
# test_message_bus.py") and remains runnable by explicit path.
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Warning filters. Add to this list ONLY with a measured justification and a test
# that pins the premise -- never to quieten a warning that has not been understood.
# ---------------------------------------------------------------------------
filterwarnings = [
    # LightGBM 4.6.0 <-> scikit-learn 1.x interaction. SPURIOUS. Investigated 2026-07-13;
    # the full measurement lives in tests/unit/test_feature_name_contract.py, which FAILS
    # if any premise below stops holding.
    #
    # LightGBM's scikit-learn wrapper populates `feature_names_in_` with SYNTHETIC names
    # ('Column_0', 'Column_1', ...) even when fitted on a bare numpy ndarray with no names
    # supplied. (scikit-learn's own estimators leave it unset in that situation.) At predict
    # time, scikit-learn's `_check_feature_names` then sees an estimator that "was fitted
    # with feature names" being given an array that has none, and warns.
    #
    # VariantEnsemble dispatches LightGBM the raw ndarray (`X_tab.values`) in fit, in
    # _leakfree_oof, in predict_proba, and in evaluate -- consistently, in every direction.
    # There is therefore no feature-name mismatch and no column-order hazard. The warning
    # describes a condition that cannot occur here. It is noise, and it fired 11 times per
    # suite run, training everyone to scroll past UserWarnings -- which is precisely how the
    # convergence defect survived for weeks.
    #
    # DO NOT broaden this to `ignore::UserWarning`. It is pinned to this exact message so a
    # DIFFERENT UserWarning still reaches us.
    #
    # DO NOT "clean this up" by passing DataFrames to LightGBM instead. That was measured on
    # 2026-07-13 and it is ACTIVELY DANGEROUS: unlike scikit-learn (ValueError), XGBoost
    # (ValueError), and CatBoost (reorders by name), LightGBM does NOT enforce its own
    # feature names -- it maps columns POSITIONALLY and returns SILENTLY WRONG predictions
    # when the column order differs (measured swing: 0.855 in predicted probability, no
    # error, no warning). The `.values` dispatch is load-bearing, not stylistic.
    "ignore:X does not have valid feature names, but LGBMClassifier was fitted with feature names:UserWarning",

    # scikit-learn 1.8.0 <-> joblib 1.5.3 thread-config propagation note. SPURIOUS for
    # correctness. Investigated 2026-07-22; the premise is pinned by
    # tests/unit/test_sklearn_parallel_warning_contract.py, which FAILS if this project
    # ever misuses `delayed` in a way that would make this warning our own signal.
    #
    # scikit-learn's estimators (e.g. RandomForest with n_jobs != 1) parallelise their
    # internal work with sklearn.utils.parallel.Parallel + sklearn.utils.parallel.delayed.
    # When such an estimator runs inside a fold or a joblib context whose thread has not had
    # the scikit-learn config attached, sklearn emits this UserWarning to note that the
    # thread-local configuration may not propagate to the joblib workers. It is a
    # PERFORMANCE/thread-config note, not a correctness signal: no prediction is wrong and
    # no result is affected -- only the propagation of config such as `assume_finite` to
    # worker threads is at issue, and this project does not rely on that propagation.
    #
    # The warning is EXECUTION-ORDER dependent: it does not fire when the emitting test file
    # runs in isolation, and across full-suite runs it is attributed to whichever file first
    # trips it (observed at 448, 2499, and 0 occurrences on different runs). That variance
    # trains readers to scroll past UserWarnings, which is exactly how a real convergence
    # defect once survived. Message-pinning removes it deterministically regardless of order.
    #
    # This is NOT our code misusing `delayed`. The only `delayed(...)` calls in the project
    # are in models/scalable_svm.py, where joblib.delayed is correctly paired with
    # joblib.Parallel (verified 2026-07-22). The pinning test asserts that pairing, so if a
    # future edit introduces a bare joblib.delayed feeding an sklearn Parallel -- which WOULD
    # make this warning our own signal -- the test fails and this filter must be reconsidered.
    #
    # DO NOT broaden this to `ignore::UserWarning`. It is pinned to this exact message so a
    # DIFFERENT UserWarning still reaches us.
    "ignore:.*sklearn.utils.parallel.delayed. should be used with.*:UserWarning",
]
