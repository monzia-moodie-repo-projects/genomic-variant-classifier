# pyproject.toml
# PEP 621 packaging metadata for genomic-variant-classifier.
#
# Replaces setup.py as part of the C1-C5 consolidate-package-layout migration
# (C2 step). See docs/hypotheses/HYP_consolidate-package-layout.md.
#
# Runtime dependencies remain in requirements.txt / requirements-api.txt /
# requirements-dev.txt (managed via pip-compile). Pre-migration setup.py had
# no install_requires; this preserves that. Migration to [project.dependencies]
# is possible at C5 audit but is not required for C2.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-variant-classifier"
version = "0.1.0"
description = "Ensemble ML system for pathogenic variant classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Monzia Moodie", email = "monzia.moodie@gmail.com" },
]

[project.urls]
Homepage = "https://github.com/monzia-moodie/genomic-variant-classifier"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genomic_variant_classifier*"]
namespaces = true

[tool.pytest.ini_options]
# Restrict pytest auto-discovery to tests/. Without this, pytest walks the
# entire rootdir and imports src/genomic_variant_classifier/agent_layer/
# test_message_bus.py during collection. That file's module-level code at
# L87-89 stubs sys.modules["torch"] = MagicMock() (and shap/ewc_utils/etc.),
# which pollutes torch for the remainder of the collection, causing scipy.
# stats's array_api_compat._issubclass_fast(ndarray, "torch", "Tensor") to
# return a MagicMock instead of torch.Tensor and raise TypeError on the
# downstream issubclass() check. See:
#   docs/incidents/INCIDENT_2026-05-26_scipy-torch-array-api-compat.md
# The agent_layer integration test is designed as a standalone script
# (per its docstring L10-14: "Run from agent_layer/: python
# test_message_bus.py") and remains runnable by explicit path.
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Warning filters. Add to this list ONLY with a measured justification and a test
# that pins the premise -- never to quieten a warning that has not been understood.
# ---------------------------------------------------------------------------
filterwarnings = [
    # AN UNCLOSED FILE, PIPE OR DIRECTORY ITERATOR FAILS THE TEST THAT LEFT IT (added 2026-11-01, WARNINGS-AND-RESOURCES-1).
    # MEASURED on the merged tree 4bcabb9f with `-W always::ResourceWarning`: 850 unclosed-resource warnings at 42 places, all
    # in this project's code (753 from one line of tests/unit/test_backup_artifacts.py; one scandir iterator in
    # scripts/preflight_check_data_paths.py; the child pipe of scripts/smoke_all_models.py), none from a library -- and the
    # default filters showed NONE of them. All 42 were closed. Python reports a leak from the object's finaliser, where an
    # exception cannot propagate, so pytest turns it into PytestUnraisableExceptionWarning: BOTH entries are needed for the
    # test to fail (tests/unit/test_warning_filters_are_scoped.py runs a planted leak through this file's own configuration).
    # These entries govern EVERY pytest run from the repository root, the drift job's `pytest tests_drift/` included: there
    # nannyml 0.13.1's usage telemetry leaked /proc/self/cgroup (pull request #59, 2026-11-02) -- the telemetry is now switched
    # off by monitoring/performance_estimator.py, not filtered here.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",

    # A RANKING METRIC COMPUTED ON UNDEFINED INPUT FAILS THE TEST THAT COMPUTED IT (added 2026-11-02,
    # CERTIFIED-AUPRC-DEGENERATE-REPLICATES-1). MEASURED: the 33 warnings every full run reported since 2026-08-26 were all
    # scikit-learn's ranking module (sklearn/metrics/_ranking.py lines 442, 1131, 1294, 1303) objecting to calls this
    # project made on single-class input -- the receiver operating characteristic and precision-recall curves on
    # single-class cohorts, and the bootstrap's metric on single-class replicates, where average precision answered 0.0
    # (warned) or 1.0 (silently) and those answers entered the certified interval. The calls are gone; this entry keeps
    # them gone. Selected by the ISSUING MODULE (field 4), not by category, so pytest's configuration never imports
    # scikit-learn. All five warning sites of that module in scikit-learn 1.8.0 (read 2026-11-02: lines 442, 1131, 1294,
    # 1303 and 2153, the last for top-k accuracy with k >= the number of classes) report a quantity that is undefined or
    # meaningless on its input -- never a measurement. tests/unit/test_replicate_engine.py runs planted calls through this
    # file's own configuration.
    "error::UserWarning:sklearn\\.metrics\\._ranking",

    # LightGBM 4.6.0 <-> scikit-learn 1.x interaction. SPURIOUS. Investigated 2026-07-13;
    # the full measurement lives in tests/unit/test_feature_name_contract.py, which FAILS
    # if any premise below stops holding.
    #
    # LightGBM's scikit-learn wrapper populates `feature_names_in_` with SYNTHETIC names
    # ('Column_0', 'Column_1', ...) even when fitted on a bare numpy ndarray with no names
    # supplied. (scikit-learn's own estimators leave it unset in that situation.) At predict
    # time, scikit-learn's `_check_feature_names` then sees an estimator that "was fitted
    # with feature names" being given an array that has none, and warns.
    #
    # VariantEnsemble dispatches LightGBM the raw ndarray (`X_tab.values`) in fit, in
    # _leakfree_oof, in predict_proba, and in evaluate -- consistently, in every direction.
    # There is therefore no feature-name mismatch and no column-order hazard. The warning
    # describes a condition that cannot occur here. It is noise, and it fired 11 times per
    # suite run, training everyone to scroll past UserWarnings -- which is precisely how the
    # convergence defect survived for weeks.
    #
    # DO NOT broaden this to `ignore::UserWarning`. It is pinned to this exact message so a
    # DIFFERENT UserWarning still reaches us.
    #
    # DO NOT "clean this up" by passing DataFrames to LightGBM instead. That was measured on
    # 2026-07-13 and it is ACTIVELY DANGEROUS: unlike scikit-learn (ValueError), XGBoost
    # (ValueError), and CatBoost (reorders by name), LightGBM does NOT enforce its own
    # feature names -- it maps columns POSITIONALLY and returns SILENTLY WRONG predictions
    # when the column order differs (measured swing: 0.855 in predicted probability, no
    # error, no warning). The `.values` dispatch is load-bearing, not stylistic.
    "ignore:X does not have valid feature names, but LGBMClassifier was fitted with feature names:UserWarning",

    # SCIKIT-LEARN'S PARALLEL-PAIRING WARNINGS FAIL THE TEST THAT RAISED THEM (until 2026-11-03 an IGNORE entry for one of them,
    # added 2026-07-22; SKLEARN-WARNING-FILTER-RACE-1). Selected by the ISSUING MODULE (field 4), like the ranking entry above.
    # scikit-learn 1.8.0's sklearn/utils/parallel.py (read in full) warns at exactly two places, and both report the same defect --
    # the scikit-learn configuration not reaching the joblib workers -- from either side:
    #   * line 29, "`sklearn.utils.parallel.Parallel` needs to be used in conjunction with `sklearn.utils.parallel.delayed`
    #     instead of `joblib.delayed` ...": a joblib.delayed task given to scikit-learn's Parallel;
    #   * line 144, "`sklearn.utils.parallel.delayed` should be used with `sklearn.utils.parallel.Parallel` ...": a task that
    #     carries no captured configuration or an EMPTY captured filter list. Read and measured, that happens three ways:
    #     1. a scikit-learn delayed function run by a Parallel that is not scikit-learn's -- a genuine defect;
    #     2. thread-parallel scikit-learn on Python 3.12 (every build with the global interpreter lock, per upstream issue
    #        #35089, open): each task enters catch_warnings(), resets and refills the ONE process-wide list, and interleaved
    #        threads can empty the list that Parallel captured. MEASURED: 448 copies on the owner's machine (2026-11-03 06:18
    #        UTC), 1,000 on pull request #58's validation (2026-11-01). While the list is empty EVERY entry here is gone, so the
    #        ignore entry could not hide the warning reliably, and the `error::` entries above could not fail anything;
    #     3. a caller that emptied the filters itself (resetwarnings()) and then fitted: no entry applies, and the warning is
    #        only shown. The package holds no such call (tests/unit/test_warning_filters_are_scoped.py) and neither does the
    #        suite.
    # tests/conftest.py removes cause 2 for the suite: joblib's "threading" backend is its sequential one for the session, and a
    # guard fails any test whose warning filters differ after its teardown from before its setup. What remains is a genuine
    # defect, so it is an ERROR. The explanation the ignore entry carried until 2026-11-01 -- a harmless thread-configuration note
    # from an estimator "inside a fold" -- was wrong.
    # tests/unit/test_sklearn_parallel_warning_contract.py runs all three pairings through this file's configuration.
    "error::UserWarning:sklearn\\.utils\\.parallel",
]
