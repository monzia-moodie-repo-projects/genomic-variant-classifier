name: Data Freshness Monitor

on:
  # Weekly, Mondays 07:00 UTC (after the ClinVar weekly VCF refresh)
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to the SAME versions ci.yml and drift_monitor.yml already use:
      # checkout v6.0.2, setup-python v6.2.0, upload-artifact v7.0.0, all node24.
      # This file alone still carried floating tags on Node 20.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # pinned to requirements.txt versions (project rolled back from pandas 3.0.x;
          # see requirements.txt + docs re: pandas 3.0.4 date_range segfault). Keep this
          # cron minimal -- the freshness agent needs no heavy ML deps.
          pip install numpy==2.4.4 pandas==2.3.3 pyarrow==23.0.1 scipy==1.17.1
          pip install -e .
      - name: Run registry-driven freshness monitor (dry-run)
        run: |
          PYTHONPATH=src python scripts/run_data_freshness.py
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: data-freshness-report
          path: reports/data_freshness/
          if-no-files-found: warn
