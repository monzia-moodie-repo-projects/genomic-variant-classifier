name: Data Freshness Monitor

on:
  # Weekly, Mondays 07:00 UTC (after the ClinVar weekly VCF refresh)
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scipy
          pip install -e .
      - name: Run registry-driven freshness monitor (dry-run)
        run: |
          PYTHONPATH=src python scripts/run_data_freshness.py
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-freshness-report
          path: reports/data_freshness/
          if-no-files-found: warn
