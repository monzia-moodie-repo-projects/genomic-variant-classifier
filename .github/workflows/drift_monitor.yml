name: Monthly Drift Monitor

on:
  # Run on the 1st of every month at 06:00 UTC — after ClinVar monthly release
  schedule:
    - cron: "0 6 1 * *"

  # Allow manual trigger with custom release labels
  workflow_dispatch:
    inputs:
      release_name:
        description: "ClinVar release label (e.g. 2024_07)"
        required: false
        default: "manual"
      auto_retrain:
        description: "Trigger retraining if drift detected"
        type: boolean
        default: false
      schema_matrix:
        # The schema gate validates a PRODUCED feature matrix against the committed baseline.
        # A hosted runner holds no such matrix (they are gitignored cohort artifacts), so this
        # is empty by default and the gate then reports NOT CHECKED (exit 3) rather than
        # inventing a verdict. Supply a path when running where a matrix exists, e.g.
        # outputs/run17_report/full/splits/X_train.parquet
        #
        # It must NOT default to Run-15's matrix: the baseline now describes the 95-column
        # Run-17 contract, and Run-15's 78-column artifact genuinely differs from it. The gate
        # would report SCHEMA DRIFT -- correctly, about history -- and a gate that goes red on
        # history is a gate everybody learns to ignore. (2026-07-13, roadmap 6.22)
        description: "Feature matrix (parquet) to validate against the schema baseline. Empty = NOT CHECKED."
        required: false
        default: ""

# Ensure only one drift monitor runs at a time
concurrency:
  group: drift-monitor
  cancel-in-progress: false

jobs:

  # ── Job 1: Feature drift detection ──────────────────────────────────────
  feature-drift:
    name: Feature Drift Check
    runs-on: ubuntu-latest
    outputs:
      readiness_status: ${{ steps.drift.outputs.readiness_status }}
      feature_drift_checked: ${{ steps.drift.outputs.feature_drift_checked }}
      not_checked_reason: ${{ steps.drift.outputs.not_checked_reason }}
      # LEGACY. `drift_level` conflates a severity with an epistemic state, and
      # UNKNOWN is the spelling that conflation forces. It survives as a
      # COMPATIBILITY PROJECTION emitted by the readiness adapter, never
      # authored here. Retire it once every consumer reads readiness_status.
      drift_level: ${{ steps.drift.outputs.drift_level }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      # -------------------------------------------------------------------------------
      # THE ISOLATED DRIFT ENVIRONMENT. (fixed 2026-07-13, roadmap 6.19)
      #
      # This step used to be `pip install -r requirements-api.txt scipy`, which installs the
      # INFERENCE stack. It contains NO evidently, NO nannyml, NO pandera, NO river -- and it
      # never installed the project package at all, so `python scripts/run_drift_monitor.py`
      # could not even have imported genomic_variant_classifier.monitoring.drift_detector.
      #
      # The scheduled drift monitor was therefore running WITHOUT its drift libraries and
      # WITHOUT the code it was supposed to run.
      # -------------------------------------------------------------------------------
      - name: Install the ISOLATED drift environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-drift.txt
          # --no-deps: keep torch / torch_geometric / pyspark OUT. pyspark in particular would
          # KILL nannyml -- pyspark 3.5.x's pandas module calls np.NaN, REMOVED in NumPy 2.0,
          # and nannyml optionally imports pyspark.
          pip install -e . --no-deps
          pip check
          python scripts/verify_drift_libs.py

      # ===============================================================================
      # THE GOOGLE DRIVE DOWNLOAD IS GONE. (2026-07-13, roadmap 6.20)
      #
      # It used to be a step called "Download reference splits from Google Drive" that:
      #
      #     1. installed gdown,
      #     2. base64-decoded a service-account secret,
      #     3. printed "real download NOT wired yet (placeholder)",
      #     4. mkdir -p'd an EMPTY directory,
      #     5. and carried `continue-on-error: true`, so even a real failure was swallowed.
      #
      # The next step then found that empty directory and reported `drift_level=none` with a
      # green tick. On the first of every month, for the life of this workflow, the drift
      # monitor created an empty folder, noticed it was empty, and declared the model healthy
      # -- having never read a single row of data.
      #
      # It is not replaced with a WORKING download, because a working download is the wrong
      # answer. It would need a credential in a secret, it would move a 23.8 MB cohort matrix
      # into a hosted runner on a public repository every month, and -- from Run 17, when the
      # OMIM connector actually populates -- that matrix carries values derived from a
      # controlled-tier, institutionally-licensed source (data_manifest.yaml:266-276; and
      # :347, "Built artifact. If derived from a controlled cohort, set sync:false").
      #
      # Instead the reference is COMMITTED, as an aggregate profile: per-feature histogram
      # counts and quantile grids, ~1,450 KB, no variant rows, no identifiers, no per-variant
      # annotation values. See src/genomic_variant_classifier/monitoring/
      # drift_reference_profile.py and scripts/build_drift_reference_profile.py.
      #
      # The Population Stability Index computed from it is BIT-IDENTICAL to the raw matrix.
      # Not approximate -- identical. Measured on the real 1,038,974-variant Run-15 matrix:
      # worst delta across all 78 features = 0.000e+00, asserted with `==` (not
      # pytest.approx) by tests/unit/test_drift_reference_profile.py.
      #
      # What the profile CANNOT do -- the multivariate Maximum Mean Discrepancy and
      # Szekely-Rizzo energy tests, which need real reference samples -- it reports as NOT
      # COMPUTED, with joint_tests_run=false. It never reports them as passing. That
      # distinction is the entire point of this rescue.
      #
      # No credential. No cloud. No download. No expiring token. It just runs.
      # ===============================================================================
      - name: Verify the committed drift reference profile is present
        run: |
          set -euo pipefail
          PROFILE=data/reference/drift/run15_reference_profile.json
          if [ ! -f "$PROFILE" ]; then
            echo "::error::The committed drift reference profile is MISSING: $PROFILE"
            echo ""
            echo "This is NOT 'no drift'. It is 'no reference', and nothing can be compared."
            echo "Rebuild it where the cohort matrix lives:"
            echo ""
            echo "    python scripts/build_drift_reference_profile.py \\"
            echo "        --reference outputs/run15_rerun_report/full/splits/X_train.parquet \\"
            echo "        --out $PROFILE"
            echo ""
            echo "See roadmap 6.20."
            exit 3
          fi
          python - <<'PY'
          from genomic_variant_classifier.monitoring.drift_reference_profile import (
              DriftReferenceProfile,
          )
          p = DriftReferenceProfile.load("data/reference/drift/run15_reference_profile.json")
          print(f"Drift reference profile OK: {len(p.feature_names)} features, "
                f"{p.n_ref_samples:,} reference rows summarised, built {p.built_at_utc}.")
          print(f"  source: {p.source}")
          print("  Contains histogram counts and quantile grids ONLY -- no variant-level data.")
          PY

      # ===============================================================================
      # "NO DRIFT DETECTED" AND "DRIFT WAS NOT CHECKED" ARE NOT THE SAME STATEMENT.
      # Reporting the second as the first is how a monitoring system lies.
      # (fixed 2026-07-13, roadmap 6.19)
      # ===============================================================================
      # THIS STEP HAD NEVER ONCE RUN A DRIFT COMPUTATION. Here is what it did:
      #
      #   1. The "Download reference splits" step above is a PLACEHOLDER. It prints
      #      "real download NOT wired yet" and does nothing but `mkdir -p` an EMPTY directory.
      #
      #   2. This step then checked whether that directory was empty. IT ALWAYS IS. And on
      #      finding it empty it did:
      #
      #          echo "No reference splits available -- skipping drift check (avoids false alert)."
      #          echo "exit_code=0"      >> $GITHUB_OUTPUT
      #          echo "drift_level=none" >> $GITHUB_OUTPUT
      #          exit 0
      #
      # So on the first of every month this workflow fired, created an empty folder, noticed
      # the folder was empty, and reported **drift_level=none** -- with a GREEN TICK -- having
      # never looked at a single row of data. It did not fail. It did not warn. It reported
      # HEALTHY. And `continue-on-error: true` meant a genuine failure would have been
      # swallowed too.
      #
      # The comment justified it as "avoids false alert". It avoids ALL alerts. IT CANNOT
      # ALERT. A clinical variant classifier has had a monthly drift monitor reporting "no
      # drift" since the day it was written, having never once checked.
      #
      # This is the same defect as every other one found on 2026-07-13 -- except worse, because
      # the others FAILED. This one SUCCEEDS. A gate that cannot fail is not a gate; it is a
      # green tick with a reassuring name.
      #
      # NOW: if the reference data is unavailable, the state is UNKNOWN, and it says so, and it
      # exits NON-ZERO. "Not checked" is never again reported as "clean".
      # ===============================================================================
      # ===============================================================================
      # THIS STEP NO LONGER INVOKES THE SCIENTIFIC MONITOR. (2026-08-24)
      #
      # It used to run:
      #
      #     python scripts/run_drift_monitor.py \
      #       --reference-profile "$PROFILE" --features-only \
      #       --release-name ... --output-dir outputs/drift_reports/
      #
      # with NO --new-data and NO --new-clinvar. Read against
      # scripts/run_drift_monitor.py:313-351, that combination takes the else
      # branch and returns EXIT_NOT_CHECKED. The monthly cron therefore ran a
      # monitor that MUST return 4, by construction, every month.
      #
      # The 2026-07-13 repair made that honest: 4 is its own outcome, it is
      # loud, and it is non-zero. This step keeps the honesty and drops the
      # pretence. A gate that cannot FAIL is a green tick with a reassuring
      # name -- and a gate that cannot PASS is a scheduled false alarm.
      #
      # The label-drift step below has done this correctly since 2026-07-13:
      # it declares a KNOWN LIMITATION, echoes the runnable command, and
      # invokes nothing. This step now does the same, with a TYPED reason
      # instead of prose.
      #
      # THE EXIT-CODE CLASSIFIER WENT WITH THE INVOCATION. Policy that outlives
      # the thing it governed is dead policy; run_drift_monitor.py still owns
      # EXIT_NOT_CHECKED = 4 and its meaning, for the assessment command that
      # will invoke it when a candidate population exists.
      #
      # NO SEMANTIC LITERAL IS AUTHORED HERE. All four outputs are projected
      # from one record by the adapter. Authoring them separately is how
      # `feature_drift_checked=false` beside `drift_level=none` becomes
      # constructible.
      # ===============================================================================
      - name: Report feature drift readiness
        id: drift
        run: |
          set -euo pipefail
          python scripts/report_drift_readiness.py --format json
          python scripts/report_drift_readiness.py --format github \
            >> "$GITHUB_OUTPUT"

      # NOTE: `continue-on-error: true` was REMOVED from this step (2026-07-13). It meant that
      # even a genuine failure of the drift monitor was swallowed and the workflow went green.
      # A monitor whose failures are ignored is not a monitor.

      # ===============================================================================
      # THE SCHEMA-DRIFT GATE COULD NOT FAIL. TWICE OVER. (fixed 2026-07-13, roadmap 6.20)
      #
      # It validates the reference feature matrix's column/dtype schema against the committed
      # baseline. `run_schema_drift_check.py` exits 0 = green, 2 = DRIFT DETECTED, 3 = usage.
      #
      # As written, it reported SUCCESS in both of the cases that matter:
      #
      #   1. If the baseline OR the matrix was absent, it echoed "skipping schema gate" and
      #      `exit 0`. "Not checked" reported as "clean" -- the exact lie the feature-drift
      #      step above told every month for the life of this workflow.
      #
      #   2. `continue-on-error: true` meant that even when it DID run and DID detect drift
      #      (exit 2), the failure was SWALLOWED and the workflow went green anyway.
      #
      # So: it could not alert when it could not see, and it could not alert when it DID see.
      # A gate that can never fail is not a gate. It is a green tick with a reassuring name.
      #
      # NOW: missing inputs are reported as UNKNOWN and exit NON-ZERO. Detected drift FAILS.
      # ===============================================================================
      - name: Run schema drift gate
        # `run_drift_monitor.py` covers PSI / Kolmogorov-Smirnov / Maximum Mean Discrepancy
        # DISTRIBUTIONAL drift. It does NOT cover schema/column/dtype drift. This gate is
        # additive, and it is the one that catches a column being renamed, retyped or dropped
        # out from under the model -- which is silent, and catastrophic.
        run: |
          set -uo pipefail
          BASELINE=data/reference/schema/schema_baseline.json

          # ---------------------------------------------------------------------------------
          # WHICH MATRIX? Deliberately NOT Run-15's. (2026-07-13, roadmap 6.22)
          #
          # This used to be hard-wired to outputs/run15_rerun_report/full/splits/X_train.parquet.
          # That is now WRONG, and would produce a red gate for a non-issue:
          #
          #   The committed baseline describes the CURRENT feature contract -- 95 columns.
          #   Run-15's matrix has 78. They differ by 19 features added since Run 15 (cosmic_*,
          #   kegg_*, rnaseq_*, genomiclm_*, finngen_r13_*, hetero_gnn_score, esm2_llr,
          #   maxentscan_delta, omim_n_diseases_molecular) and 2 removed (the HGMD pair).
          #
          #   Validating a Run-15 artifact against a Run-17 contract would report SCHEMA DRIFT
          #   DETECTED -- and it would be RIGHT: they genuinely differ. But that is a fact about
          #   history, not a defect in the current run, and a gate that goes red on history is a
          #   gate everybody learns to ignore.
          #
          # The schema gate must validate the matrix THIS RUN PRODUCED. Point SCHEMA_MATRIX at
          # it via the workflow input, or leave it empty -- in which case this step reports
          # NOT CHECKED (exit 3) rather than inventing a verdict.
          #
          # NOTE the division of labour, so nothing is silently uncovered:
          #   * That the BASELINE agrees with the feature contract is asserted on every single
          #     Continuous Integration run by tests/unit/test_schema_baseline_matches_contract.py
          #     (column set, column ORDER, count, and all-float64 dtypes). That check needs no
          #     data and runs everywhere.
          #   * That a produced MATRIX agrees with the baseline is what THIS gate is for, and it
          #     can only run where a matrix exists.
          # ---------------------------------------------------------------------------------
          MATRIX="${{ github.event.inputs.schema_matrix || '' }}"

          MISSING=""
          [ -f "$BASELINE" ] || MISSING="$MISSING $BASELINE"

          if [ -z "$MATRIX" ]; then
            echo "::warning::SCHEMA DRIFT WAS NOT CHECKED -- no feature matrix was supplied."
            echo ""
            echo "This is NOT 'no schema drift'. It is 'no measurement', and it says so."
            echo "This step used to echo 'skipping schema gate' and exit 0 -- reporting a clean"
            echo "bill of health for a check it had not performed (roadmap 6.20)."
            echo ""
            echo "A hosted runner holds no feature matrix: they are gitignored cohort artifacts."
            echo "The baseline-vs-CONTRACT half of this check DOES run on every CI build, in"
            echo "tests/unit/test_schema_baseline_matches_contract.py. The baseline-vs-MATRIX"
            echo "half runs where a matrix exists:"
            echo ""
            echo "    python scripts/run_schema_drift_check.py \\"
            echo "        --baseline $BASELINE \\"
            echo "        --matrix outputs/<this-run>/full/splits/X_train.parquet"
            echo ""
            echo "schema_checked=false" >> "$GITHUB_OUTPUT"
            exit 3
          fi

          if [ -n "$MISSING" ] || [ ! -f "$MATRIX" ]; then
            echo "::error::SCHEMA DRIFT WAS NOT CHECKED. Missing:$MISSING $MATRIX"
            echo "This is NOT 'no schema drift'. It is 'no measurement'."
            exit 3
          fi

          python scripts/run_schema_drift_check.py --baseline "$BASELINE" --matrix "$MATRIX"
          SCHEMA_EXIT=$?
          if [ "$SCHEMA_EXIT" -eq 2 ]; then
            echo "::error::SCHEMA DRIFT DETECTED. The reference feature matrix's columns or"
            echo "dtypes no longer match the committed baseline. A renamed, retyped or dropped"
            echo "column is silent and catastrophic: the model keeps predicting, on the wrong"
            echo "data. This exit code used to be SWALLOWED by continue-on-error."
          fi
          exit $SCHEMA_EXIT
        # continue-on-error REMOVED 2026-07-13. It swallowed exit 2 -- DRIFT DETECTED -- and
        # turned it into a green tick. A gate whose alert is discarded is not a gate.

      - name: Upload drift report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: feature-drift-report
          path: outputs/drift_reports/
          retention-days: 90

  # ── Job 2: Label drift (ClinVar reclassification) ────────────────────────
  label-drift:
    name: ClinVar Label Drift Check
    runs-on: ubuntu-latest
    needs: feature-drift

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas pyarrow

      # ===============================================================================
      # THIS STEP PRINTED A CLAIM IT NEVER VERIFIED. (fixed 2026-07-13, roadmap 6.20)
      #
      # It was:
      #
      #     import urllib.request, json
      #     url = 'https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/'
      #     print('ClinVar FTP reachable')
      #
      # It imported urllib, assigned a URL to a STRING VARIABLE, and printed "ClinVar FTP
      # reachable" -- WITHOUT EVER CALLING urlopen(). It never contacted the File Transfer
      # Protocol server. It simply asserted that it had. And `continue-on-error: true` meant
      # that even if it had somehow failed, the failure would have been discarded.
      #
      # It now ACTUALLY MAKES THE REQUEST.
      # ===============================================================================
      - name: Check for new ClinVar release
        id: clinvar_check
        run: |
          python - <<'PY'
          import sys
          import urllib.error
          import urllib.request

          URL = "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/"
          try:
              with urllib.request.urlopen(URL, timeout=30) as resp:
                  status = resp.status
                  body = resp.read(4096).decode("utf-8", "ignore")
          except urllib.error.URLError as exc:
              print(f"::error::ClinVar File Transfer Protocol server UNREACHABLE: {exc}")
              print(f"  url: {URL}")
              print("  This step used to PRINT 'ClinVar FTP reachable' without making the")
              print("  request at all. It now actually checks, and says so when it cannot.")
              sys.exit(1)

          if status != 200:
              print(f"::error::ClinVar FTP returned HTTP {status} (expected 200) for {URL}")
              sys.exit(1)

          # The listing should mention the release files. If it does not, the layout changed.
          if "clinvar" not in body.lower():
              print(f"::error::ClinVar FTP returned HTTP 200 but the listing does not mention")
              print(f"  'clinvar'. The directory layout may have changed. url: {URL}")
              print(f"  first 200 bytes: {body[:200]!r}")
              sys.exit(1)

          print(f"ClinVar File Transfer Protocol reachable: HTTP {status}, listing looks valid.")
          PY

      # ===============================================================================
      # LABEL DRIFT IS NOT CHECKED HERE, AND IT NOW SAYS SO. (2026-07-13, roadmap 6.20)
      #
      # This step used to be two `echo`s -- "Label drift check requires local ClinVar
      # parquets" and "Run manually: ..." -- followed by exit 0. A green tick for a check that
      # was never performed and was never going to be.
      #
      # It is a KNOWN LIMITATION, not a bug: label drift compares two ClinVar releases, and the
      # hosted runner has neither. But a known limitation must be REPORTED as one, not
      # laundered into a success. It now sets an explicit output that the notification job
      # reads, so "label drift was not checked" appears in the alert rather than being
      # silently absent from it.
      # ===============================================================================
      - name: Label drift -- NOT CHECKED on the hosted runner
        id: label_drift
        if: steps.clinvar_check.outcome == 'success'
        run: |
          echo "::warning::LABEL DRIFT WAS NOT CHECKED."
          echo "  Label drift compares ClinVar reclassifications between two releases. The"
          echo "  hosted runner has neither parquet. This is a KNOWN LIMITATION (roadmap 6.20),"
          echo "  and it is REPORTED, not laundered into a green tick."
          echo ""
          echo "  To run it where the data lives:"
          echo "    python scripts/run_drift_monitor.py \\"
          echo "      --new-clinvar data/processed/clinvar_grch38_latest.parquet \\"
          echo "      --old-clinvar data/processed/clinvar_grch38_previous.parquet \\"
          echo "      --reference-splits outputs/run15_rerun_report/full/splits/ \\"
          echo "      --estimate-performance \\"
          echo "      --reference-predictions outputs/run15_rerun_report/full/oof_predictions.parquet \\"
          echo "      --analysis-predictions  outputs/drift_reports/new_release_predictions.parquet"
          echo "label_drift_checked=false" >> "$GITHUB_OUTPUT"
        # In a self-hosted runner with data access, replace with:
        # python scripts/run_drift_monitor.py \
        #   --reference-splits outputs/run15_rerun_report/full/splits/ \
        #   --new-clinvar data/processed/clinvar_grch38_latest.parquet \
        #   --old-clinvar data/processed/clinvar_grch38_previous.parquet \
        #   --release-name "${{ github.event.inputs.release_name || 'scheduled' }}" \
        #   --output-dir outputs/drift_reports/

  # ═══════════════════════════════════════════════════════════════════════════
  # ── Job 3: Notify ──────────────────────────────────────────────────────────
  #
  # THIS JOB HAS NEVER RUN. NOT ONCE. (fixed 2026-07-13, roadmap 6.20)
  #
  # Its condition was `if: needs.feature-drift.outputs.drift_level != 'none'`.
  #
  # And `drift_level` was ALWAYS 'none' -- because the feature-drift step hard-coded it,
  # without checking, every month, for the life of this workflow (the reference-splits
  # download is a placeholder that only mkdir's an empty directory; the step saw the empty
  # directory and reported drift_level=none with a green tick).
  #
  # So the alerting chain was: empty folder -> "none" -> condition false -> NO ALERT.
  # The drift alerting system has never sent a single alert, and STRUCTURALLY COULD NOT.
  #
  # TWO FIXES:
  #   1. `if: always() && ...` -- the feature-drift job now FAILS (exit 3) when it cannot see
  #      the data, and a failed `needs` job would otherwise SKIP this one entirely. A monitor
  #      that goes blind must SHOUT, not go quiet.
  #   2. drift_level='UNKNOWN' is now a first-class outcome, and the issue body says
  #      "DRIFT WAS NOT CHECKED" -- it does NOT report it as drift detected. Conflating "I
  #      looked and saw nothing" with "I could not look" in EITHER direction is the defect.
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: Drift Notification
    runs-on: ubuntu-latest
    needs: [feature-drift, label-drift]
    # always(): the feature-drift job now FAILS when it cannot see the reference data. Without
    # always(), a failed dependency SKIPS this job -- and the monitor would go silent at exactly
    # the moment it has something to say.
    # A KNOWN ARCHITECTURAL LIMITATION IS NOT AN INCIDENT. (2026-08-24)
    #
    # The old condition was `drift_level != 'none'`. Once the monthly job
    # became readiness-only it emits UNKNOWN every run, so that condition would
    # have filed an issue every month -- replacing a permanent false-green with
    # a permanent noisy-yellow. Alert fatigue is the next defect, not a repair.
    #
    # So: notify when drift was MEASURED and is not none, or when the reason a
    # measurement did not happen is anything OTHER than the known, recorded,
    # unchanged capability gap. A NEW not-checked reason is an incident; the
    # standing one is a fact already written down.
    #
    # When candidate discovery lands, candidate_discovery_not_implemented
    # becomes unemittable, and a test enforces that migration.
    if: >-
      always() &&
      (
        (
          needs.feature-drift.outputs.feature_drift_checked == 'true' &&
          needs.feature-drift.outputs.drift_level != 'none'
        ) ||
        (
          needs.feature-drift.outputs.feature_drift_checked == 'false' &&
          needs.feature-drift.outputs.not_checked_reason !=
            'candidate_discovery_not_implemented'
        )
      )
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create GitHub Issue for drift alert
        # actions/github-script v8.0.0 -- runs.using: node24 (was v7 / node20).
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            // 2026-08-24. THREE DEFECTS REPAIRED HERE, ONE OF THEM INTRODUCED BY THE
            // SAME EDIT THAT REMOVED THE MONITOR INVOCATION.
            //
            //  1. `exitCode` read `needs.feature-drift.outputs.exit_code`, which no
            //     longer exists: the readiness adapter emits no exit code, because the
            //     verdict is a record and not a process status. It would have rendered
            //     as an EMPTY STRING in this issue -- a silently blank field.
            //
            //  2. The severity branch compared `exitCode >= 3` -- a STRING against a
            //     number. With an empty string every comparison is false, so every
            //     measured drift would have been described as "Minor". Severity is now
            //     read from `driftLevel`, which is already a severity.
            //
            //  3. The not-checked explanation named a "Download reference splits from
            //     Google Drive" step as the ROOT CAUSE. That step was removed; the
            //     reference profile is now committed and verified earlier in this
            //     workflow. The alert stated a cause repaired weeks earlier.
            //     DRIFT-ALERT-BODY-STALE-1.
            //
            // The explanation is now DERIVED from the typed reason. Prose that restates
            // a cause goes stale; prose that renders one cannot.
            const readiness  = '${{ needs.feature-drift.outputs.readiness_status }}';
            const checked    = '${{ needs.feature-drift.outputs.feature_drift_checked }}' === 'true';
            const reason     = '${{ needs.feature-drift.outputs.not_checked_reason }}';
            const driftLevel = '${{ needs.feature-drift.outputs.drift_level }}';
            const date       = new Date().toISOString().split('T')[0];

            // "I could not look" is NOT "I looked and saw nothing", and it is NOT "I saw
            // drift". Reporting it as either is how a monitoring system lies.
            const isUnknown = !checked;

            const NOT_CHECKED_EXPLANATIONS = {
              'candidate_discovery_not_implemented': [
                'No authoritative mechanism for discovering a new observation population',
                'exists in this repository, so readiness could not be evaluated. This is a',
                'KNOWN, RECORDED capability gap -- not a failure, and not a finding.',
                '',
                'It is explicitly NOT the claim that no new observation population exists.',
                'Nothing here is entitled to know that.',
              ].join('\n'),
              'no_new_observation_population': [
                'Discovery ran and found no eligible new observation population to compare',
                'against the reference. Nothing was measured, and nothing is claimed.',
              ].join('\n'),
            };

            const urgency = isUnknown ? '❓ NOT CHECKED' : ({
              'minor':       '⚠️ Minor',
              'significant': '🔴 Significant',
              'severe':      '🚨 SEVERE',
            }[driftLevel] || '📊');

            const headline = isUnknown
              ? `## ❓ DRIFT WAS NOT CHECKED — ${date}`
              : `## ${urgency} Data Drift Detected — ${date}`;

            const body = [
              headline,
              '',
              `**Readiness:** ${readiness}`,
              `**Feature drift checked:** ${checked}`,
              `**Drift level:** ${driftLevel || '(none asserted)'}`,
              isUnknown ? `**Reason not checked:** \`${reason}\`` : '',
              '',
              '### What this means',
              isUnknown
                ? [
                    '**NOTHING WAS MEASURED. This is not a clean bill of health, and it is',
                    'not a drift detection.**',
                    '',
                    NOT_CHECKED_EXPLANATIONS[reason]
                      || `No explanation is registered for the reason \`${reason}\`. That is`
                         + ' itself a defect: a reason without an explanation cannot be acted on.',
                  ].join('\n')
                : driftLevel === 'severe'
                ? '**URGENT:** Severe distributional shift detected. Retraining should begin within 24 hours.'
                : driftLevel === 'significant'
                ? 'Significant drift detected. Retraining recommended before the next ClinVar release.'
                : 'Minor drift detected. Increase monitoring frequency.',
              '',
              '### Next steps',
              '1. Review the drift report in the [Actions artifacts](../actions)',
              '2. Check which features have the highest PSI scores',
              '3. If retraining is warranted, run:',
              '```powershell',
              '.venv\\Scripts\\python scripts\\run_drift_monitor.py \\',
              '    --reference-splits outputs/run15_rerun_report/full/splits/ \\',
              '    --new-clinvar data/processed/clinvar_grch38_latest.parquet \\',
              '    --old-clinvar data/processed/clinvar_grch38_previous.parquet \\',
              '    --auto-retrain',
              '```',
              '',
              '### Promotion',
              'Do not promote by comparing a number by hand. Register the candidate,',
              'promote it to shadow, and let ModelRegistry.evaluate_for_production',
              'apply the policy: it refuses on evaluation-protocol mismatch, roster',
              'mismatch, a non-durable artifact location, an absolute floor breach and',
              'a regression beyond tolerance -- in that order, because a metric measured',
              'under one protocol is not comparable with one measured under another.',
              '',
              'BASELINE-1: this section previously named a specific threshold derived',
              'by subtracting a constant from a production figure whose provenance is',
              'unestablished. A derived quantity of an unknown is not a policy.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[Drift Alert] ${urgency} data drift detected — ${date}`,
              body,
              labels: ['drift-alert', driftLevel === 'severe' ? 'urgent' : 'monitoring'],
            });

  # ── Job 4: Automated smoke test after manual retrain ────────────────────
  verify-model:
    name: Verify Current Production Model
    runs-on: ubuntu-latest
    # Run independently every month to confirm the production model still passes smoke tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API dependencies
        run: pip install -r requirements-api.txt

      # ===============================================================================
      # A SMOKE TEST THAT COULD NOT FAIL. (fixed 2026-07-13, roadmap 6.20)
      #
      # It was three branches, each returning success:
      #   a missing registry file      -> printed 'skipping', exited 0
      #   no production model declared -> printed a notice,   exited 0
      #   an unqualified production performance scalar below a hard-coded
      #     minimum                    -> printed a WARNING,  exited 1
      #   ...with `continue-on-error: true`, which SWALLOWED even the last.
      #
      # The retired attribute name is DELIBERATELY not reproduced here.
      # A comment quoting the thing it records as removed becomes a
      # second occurrence, and defeats any check that looks for the
      # first -- which cost the DOCKERCOPY-1 installer four refusals on
      # 2026-08-07 before the lesson was generalised.
      #
      # So: "no registry" = success. "no production model" = success. "production AUROC
      # below the minimum" = success, because the failure was discarded. The path it
      # looked for sat under a directory .gitignore excludes wholesale, so the file
      # could never be committed, the check took the FIRST branch every time, and it
      # reported green having tested nothing.
      #
      # THAT PATH IS NOT WRITTEN OUT HERE. It is on the forbidden list this
      # commit enforces, and a comment reproducing it is a second occurrence
      # that defeats the check -- which is exactly what happened on this
      # installer's first run.
      #
      # Three ways to pass, none of which involve the model being any good. Fourth instance of
      # this exact defect in this one workflow file.
      #
      # NOW: a missing registry is UNKNOWN, not clean. A below-threshold AUROC FAILS.
      # ===============================================================================
      - name: Validate declared production registry state
        # REGISTRY-1c (2026-08-07). THE NAME IS PRECISE ON PURPOSE.
        # This step reads a file in version control. It can establish
        # that the DECLARED production state satisfies policy; it cannot
        # establish that any running process is serving those bytes.
        # Calling it a health check would let Continuous Integration
        # acquire stronger prose than its evidence supports.
        #
        # GATE-1: this step no longer performs arithmetic. It translates
        # a typed verdict into an exit code -- 3 not checked, 1 invalid,
        # 0 valid -- and the policy lives in Python where it can be
        # tested. A workflow that knows thresholds is a second policy
        # engine nobody tests.
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          from genomic_variant_classifier.monitoring.model_registry import (
              ModelRegistry,
              ProductionValidationStatus,
              PromotionPolicy,
              RegistryInvariantError,
          )

          registry_path = Path("deployments/registry.v1.json")
          if not registry_path.exists():
              print(f"::error::NOT CHECKED. {registry_path} is absent.")
              print("  This is NOT 'the declaration is fine'. It is")
              print("  'no declaration was examined'.")
              sys.exit(3)

          try:
              registry = ModelRegistry.load(registry_path)
          except RegistryInvariantError as exc:
              print(f"::error::THE DECLARATION IS UNREADABLE: {exc}")
              sys.exit(1)

          for line in registry.summary_lines():
              print(line)

          policy = PromotionPolicy(
              policy_id="production-audit-v1",
              metric_name="auroc",
              require_durable_uri=True,
          )
          validation = registry.validate_current_production(policy)
          print(f"status={validation.status.value} record={validation.record_id}")
          if validation.detail:
              print(f"  {validation.detail}")
          for blocker in validation.blockers:
              print(f"  blocker: {blocker}")

          if validation.status is ProductionValidationStatus.NOT_CHECKED:
              print("::error::PRODUCTION STATE NOT CHECKED.")
          elif validation.status is ProductionValidationStatus.INVALID:
              print("::error::THE DECLARED PRODUCTION STATE IS INVALID.")
          else:
              print("DECLARED production registry state is valid.")
          sys.exit(validation.exit_code)
          PY
        # continue-on-error REMOVED 2026-07-13. It discarded the ONE failure this step could
        # produce -- a production model whose AUROC had fallen below the minimum.