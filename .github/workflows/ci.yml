name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/genomic-variant-classifier

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Check that requirements-api.lock is in sync with requirements-api.txt.
  # Run locally to regenerate:
  #   pip install pip-tools
  #   pip-compile requirements-api.txt -o requirements-api.lock
  # ─────────────────────────────────────────────────────────────────────────
  lockfile-check:
    name: lockfile drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      # ===============================================================================
      # THIS GATE WAS REBUILT ON 2026-07-14. READ THIS BEFORE "RESTORING" THE RECOMPILE.
      # (roadmap 6.25)
      #
      # HISTORY, in two mistakes:
      #
      # 1. ORIGINALLY it ran `pip install --dry-run -r requirements-api.lock` and called that a
      #    lockfile check. That proves only the lock INSTALLS -- never that it MATCHES
      #    requirements-api.txt. A stale lock sailed through green while the Docker API image
      #    shipped the old pin. Root pattern (c): a gate that checks a proxy is not a gate.
      #
      # 2. THE FIX (2026-07-13, roadmap 6.19) OVERCORRECTED. It RECOMPILED the lock and failed
      #    if the result differed from what is committed. That gate CANNOT STOP FAILING, for
      #    five independent reasons, each sufficient alone:
      #
      #      a. pip-compile PRESERVES the pins of an existing output file. Compiling to a NEW
      #         path (/tmp/regenerated.lock) has nothing to preserve, so it resolves the whole
      #         tree to the latest on the index. MEASURED 2026-07-14, same machine, same
      #         minute: `-o requirements-api.lock` -> slowapi 0.1.9 (preserved);
      #         `-o /tmp/fresh.lock` -> slowapi 0.1.10 (latest). Same input, opposite answers.
      #      b. 22 transitive packages drifted between the commit and a fresh compile MINUTES
      #         later, with `git diff HEAD -- requirements-api.txt` EMPTY. Time passed.
      #      c. `pip install -q pip-tools` was UNPINNED, so the resolver drifted too -- and its
      #         --strip-extras default flips `uvicorn[standard]` to `uvicorn`, a diff by itself.
      #      d. Environment markers make pip-compile output PLATFORM-SPECIFIC (see the Linux
      #         assertion below -- this is the real defect the broken gate stumbled into).
      #      e. The committed lock's header says Python 3.12; this runner is 3.11. Markers
      #         keyed on python_version resolve differently.
      #
      # A GATE THAT GOES RED BECAUSE A STRANGER PUBLISHED A WHEEL IS NOT A GATE. It is a
      # scheduled false alarm -- and a scheduled false alarm gets muted, taking the real signal
      # with it. It failed on its FIRST real exposure (run 29374485597) and, because `test`
      # depended on it, took the ENTIRE 1,936-test suite down with it. Zero tests ran on Linux.
      #
      # WHAT IT DOES NOW -- assert the two things that are actually true-or-false:
      #   1. The lock SATISFIES requirements-api.txt. Deterministic. No network, no recompile,
      #      no dependence on the day/platform/Python/pip-tools version. Cannot drift.
      #      Implemented ONCE in scripts/check_lock_satisfies.py and called BOTH here and from
      #      tests/unit/test_requirements_files_agree.py, so the gate and the test can never
      #      disagree about the rule (the lesson of roadmap 6.24's split-brain detector).
      #   2. The lock INSTALLS on Linux with no conflicts. Only Linux can answer that.
      #
      # WHAT IT DELIBERATELY DOES NOT CHECK: that the lock's transitive dependencies are the
      # newest available. THAT IS NOT A DEFECT -- freezing a resolution is the entire purpose of
      # a lock. Upgrading is a deliberate, reviewed act (`pip-compile --upgrade`, read the diff,
      # run the suite, commit), not something a gate extorts every time a patch ships.
      # ===============================================================================
      - name: Assert the API lockfile SATISFIES requirements-api.txt (deterministic)
        run: |
          set -euo pipefail
          pip install -q packaging
          python scripts/check_lock_satisfies.py --verbose

      - name: Assert the API lockfile installs cleanly on Linux with no conflicts
        run: |
          set -euo pipefail

          if [ ! -f requirements-api.lock ]; then
            echo "requirements-api.lock does not exist. Run:"
            echo "    pip-compile requirements-api.txt -o requirements-api.lock"
            exit 1
          fi

          echo "Resolving requirements-api.lock on Linux..."
          pip install --dry-run -r requirements-api.lock
          echo "Lockfile installs cleanly on Linux."

      # -------------------------------------------------------------------------------
      # THE LOCK MUST DESCRIBE THE PLATFORM IT IS DEPLOYED TO. (2026-07-14, roadmap 6.25)
      #
      # Dockerfile:68-70 installs requirements-api.lock into the API image, and that image is
      # `python:3.11-slim-bookworm` -- LINUX. But pip-compile output is PLATFORM-SPECIFIC,
      # because environment markers are resolved at compile time, not install time. Read
      # uvicorn 0.42.0's own wheel metadata:
      #
      #     colorama>=0.4;   sys_platform == "win32"  and extra == "standard"
      #     uvloop>=0.15.1;  sys_platform != "win32"  and extra == "standard"
      #
      # The committed lock CONTAINS colorama and LACKS uvloop. It was compiled on WINDOWS, and
      # it is installed on LINUX. So the production API image ships a pointless Windows
      # terminal shim and -- far worse -- SILENTLY LOSES uvloop, the high-performance event
      # loop that `uvicorn[standard]` exists to provide. The image runs the default asyncio
      # loop while every document says otherwise.
      #
      # This is roadmap 6.18's defect class exactly: requirements.txt was compiled under
      # Python 3.14, where torch has no wheels, and SILENTLY OMITTED THE ENTIRE TORCH STACK.
      # Here a lock compiled under Windows silently omits uvloop. Root pattern (d): a
      # resolution from one environment is evidence about THAT environment, not the target.
      #
      # This assertion is deliberately narrow and evidence-based: it names the two packages
      # whose markers are known and measured, rather than pretending to a general theory of
      # marker resolution.
      # -------------------------------------------------------------------------------
      - name: Assert the API lockfile was compiled FOR Linux (the platform it is deployed to)
        run: |
          set -uo pipefail
          FAIL=0

          # NOTE: single quotes throughout. Backticks inside a double-quoted bash string are
          # COMMAND SUBSTITUTION -- "contains `colorama`" would try to EXECUTE colorama and
          # substitute its output. Caught before this shipped; recorded because a workflow
          # that mangles its own error message is a workflow nobody trusts.
          if grep -qiE '^colorama==' requirements-api.lock; then
            echo '::error::requirements-api.lock contains colorama, whose marker is'
            echo 'sys_platform == "win32". This lock was compiled on WINDOWS.'
            FAIL=1
          fi

          if ! grep -qiE '^uvloop==' requirements-api.lock; then
            echo '::error::requirements-api.lock is MISSING uvloop, which uvicorn[standard]'
            echo 'requires on every platform except win32. This lock was compiled on WINDOWS.'
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "The Docker API image (Dockerfile:68-70) is python:3.11-slim-bookworm -- LINUX --"
            echo "and it installs THIS lock. A Windows-compiled lock is not a description of it:"
            echo "uvicorn[standard] silently loses uvloop and falls back to the default asyncio"
            echo "event loop in production."
            echo ""
            echo "Regenerate it ON LINUX, with the Python the image uses (3.11). From the repo root:"
            echo "    docker run --rm -v \"\$PWD\":/w -w /w python:3.11-slim-bookworm sh -c \\"
            echo "      'pip install -q pip-tools && pip-compile requirements-api.txt -o requirements-api.lock'"
            echo ""
            echo "See docs/ROADMAP.md 6.25. This is the same defect class as 6.18, where"
            echo "requirements.txt compiled under Python 3.14 silently omitted the torch stack."
            exit 1
          fi
          echo "Lockfile targets Linux: uvloop present, colorama absent."

  # ─────────────────────────────────────────────────────────────────────────
  # `needs: lockfile-check` REMOVED 2026-07-14 (roadmap 6.25).
  #
  # The test suite does not depend on requirements-api.lock. It never has. That file describes
  # the API Docker image's inference-only environment; pytest installs requirements.txt and
  # exercises the science. They are ORTHOGONAL concerns that happened to be chained.
  #
  # The cost of the chain, measured: on run 29374485597 the lockfile gate failed (spuriously --
  # see the long note on that job), and `drift monitor`, `pytest`, `Docker build smoke test`
  # and `Push image to GHCR` ALL reported "Skipped after 0s". **1,936 tests never ran on
  # Linux.** A dependency-hygiene check took the entire suite down with it, on the one push
  # that most needed validating: 47 files, two commits, an HGMD removal, a feature-contract
  # change from 97 to 95, and three new gates -- none of it verified outside Windows.
  #
  # A gate should fail the thing it protects. It should not fail everything else as well.
  # Docker build still needs the lock (it installs it), so THAT dependency stays.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use lockfile when present (exact reproducibility); fall back to ranges
          pip install -r requirements-api.lock
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # -------------------------------------------------------------------------------
      # PROVE THE DEPENDENCIES THAT MATTER ARE ACTUALLY HERE. (2026-07-13, roadmap 6.17)
      #
      # Until today, `torch_geometric` was absent from requirements.txt -- so it was absent
      # from this runner -- so ELEVEN test entries covering the STRING-DB graph neural
      # network, the hetero-graph neural network, GraphGPS, the graph-neural-network
      # ablation and the inductive path SILENTLY SKIPPED. In 508 Continuous Integration
      # runs. `gnn_score` is a real, non-degenerate feature in the ensemble. The entire
      # graph-neural-network branch was untested by the gate.
      #
      # Likewise `pandera` (5 schema-drift tests), `pyspark` (3), `river` (1), and `mapie`
      # (the ONLY independent check of this project's from-scratch conformal prediction --
      # it had never executed on ANY machine, ever).
      #
      # A skipped test is a test that did not run. `-rs` (below) now prints every skip
      # reason, but a reason nobody reads is not a gate. So this step FAILS THE BUILD if a
      # dependency that is supposed to be covered has silently gone missing again -- rather
      # than letting its tests quietly skip and the suite report green.
      # -------------------------------------------------------------------------------
      - name: Assert the coverage-critical dependencies are present
        run: |
          python - <<'PY'
          import importlib, sys

          # package -> what silently stops being tested if it is absent
          REQUIRED = {
              "torch":           "every neural model (tabular_nn, cnn_1d, mc_dropout, deep_ensemble, kan)",
              "torch_geometric": "the ENTIRE graph-neural-network branch (11 test entries; gnn_score is a real ensemble feature)",
              "networkx":        "STRING-DB graph construction",
              "pandera":         "schema-drift detection (5 tests)",
              "pyspark":         "3 tests in test_core",
              "river":           "online drift detection (1 test)",
              "mapie":           "the ONLY independent cross-check of our from-scratch conformal prediction (3 tests)",
              "lightgbm":        "a base model",
              "xgboost":         "a base model",
              "catboost":        "a base model",
              "imodelsx":        "the Kolmogorov-Arnold Network backend",
          }

          missing = {}
          for mod, why in REQUIRED.items():
              try:
                  m = importlib.import_module(mod)
                  v = getattr(m, "__version__", "?")
                  print(f"  OK   {mod:<16} {v}")
              except Exception as exc:
                  missing[mod] = (why, f"{type(exc).__name__}: {exc}")

          if missing:
              print("\nMISSING COVERAGE-CRITICAL DEPENDENCIES:\n")
              for mod, (why, err) in missing.items():
                  print(f"  {mod}\n      silently disables: {why}\n      {err}\n")
              print("These are declared in requirements.txt. If they are not installed here,")
              print("their tests will SKIP and this suite will report GREEN while covering")
              print("nothing. That is exactly how the graph-neural-network branch went")
              print("untested for 508 runs. Failing the build instead.")
              sys.exit(1)
          PY

      # -------------------------------------------------------------------------------
      # `pip check` AS A HARD GATE. (added 2026-07-13, roadmap 6.19)
      #
      # pip has been REPORTING a real dependency conflict on every single run, in an ERROR
      # line, and exiting 0:
      #
      #   ERROR: pip's dependency resolver does not currently take into account all the
      #   packages that are installed. This behaviour is the source of the following
      #   dependency conflicts.
      #   prometheus-fastapi-instrumentator 7.1.0 requires starlette<1.0.0,>=0.30.0,
      #       but you have starlette 1.0.0 which is incompatible.
      #
      # `pip check` occurrences in this workflow before today: ZERO. So the build went green
      # for 508 runs while the API's Prometheus metrics middleware ran against an unsupported
      # starlette. The machine said it plainly, every single time, and nothing failed.
      #
      # A dependency conflict that nothing ever checks is the same defect as a test that
      # nothing ever runs -- and this project has now been bitten by that shape SIX times in
      # one day (a non-converged model, a silently-erased base model, LightGBM's positional
      # column mapping, a wrongly-clamped Nystrom dimension, a Kolmogorov-Arnold Network
      # absent from every run since May, and an entirely untested graph-neural-network branch).
      # Every one was PRINTING, in plain output, and being scrolled past.
      #
      # The conflict is fixed (requirements-api.txt now takes
      # prometheus-fastapi-instrumentator>=8.0, whose 8.0.2 requires starlette>=1.0.0,<2.0.0 --
      # exactly what we run). This gate stops the next one from surviving 508 runs.
      #
      # NOTE: `pip check` cannot see the SIX conflicts previously reported on the developer's
      # laptop. Those were LOCAL POLLUTION -- stray nannyml/evidently/fairlearn/
      # great_expectations that requirements.txt never declared. Removing them took local
      # `pip check` from 6 conflicts to 0. See roadmap 6.19.
      # -------------------------------------------------------------------------------
      - name: pip check -- fail on ANY dependency conflict
        run: |
          set -euo pipefail
          echo "Resolved dependency graph must be internally consistent."
          if ! pip check; then
            echo ""
            echo "::error::pip check found broken requirements (above)."
            echo "pip prints these as an ERROR during install and then exits 0, so they have"
            echo "survived 508 Continuous Integration runs unnoticed. They no longer do."
            echo ""
            echo "Fix the pin in requirements.txt / requirements-api.txt, regenerate the lock,"
            echo "and re-run. Do NOT silence this gate."
            exit 1
          fi
          echo "pip check: no broken requirements."

      - name: Run the test suite
        env:
          # ESM-2 weights are never downloaded in CI: forcing offline makes any
          # model-needing test fail fast with OSError (caught -> skip) instead of
          # flaking on HuggingFace Hub 429 rate-limits. See INCIDENT_2026-06-12.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          # --maxfail REMOVED (2026-07-12). It was --maxfail=5, and it hid the truth.
          #
          # On 2026-07-08 the suite was RED with 24 failures across four clusters. This gate
          # reported "5 failed, 649 passed" and stopped. Nobody knew the real number, because
          # the gate was configured never to say it. A gate that under-reports the size of a
          # failure is worse than a gate that fails loudly: it makes the damage look small
          # enough to defer, and it was deferred for three days.
          #
          # The suite is ~5 minutes. There is no budget argument for truncating it.
          #
          # -rs REPORTS THE REASON FOR EVERY SKIP (2026-07-12). A skip is a test that did not
          # run; a silent skip is a test that did not run and did not say so. Seven AlphaFold
          # structural tests (predicted Local Distance Difference Test parsing, Relative
          # Solvent Accessibility, Define Secondary Structure of Proteins records,
          # alpha-carbon geometry, and the residue off-by-one tripwire) skipped in EVERY
          # Continuous Integration run for weeks, keyed off a gitignored file, and nothing in
          # this output ever said so. Skip reasons are now always printed.
          #
          # SCOPE WIDENED tests/unit/ -> tests/ (2026-07-13, roadmap 6.2).
          #
          # Until today this gate ran `pytest tests/unit/` -- 175 files. It therefore never
          # executed, on any runner, in 508 Continuous Integration runs:
          #
          #     tests/*.py          22 files   cohort construction & data provenance
          #     tests/conformal/     7 files   conformal prediction
          #     tests/integration/   1 file    Monte-Carlo-dropout calibration
          #     ------------------------------
          #                         30 files   NEVER RUN IN CONTINUOUS INTEGRATION
          #
          # Read the names of the 22 root-level files before dismissing this as bookkeeping:
          # build_cohort_from_source, build_cohort_v2, clean_cohort, cohort_v3_rebuild,
          # dedup_collapse, diff_cohorts, ingest_clinvar_snapshot, recover_alleleless_*,
          # recover_by_sourceid, rekey_seq_windows_v2, seq_window_manifest, split_protocol_v2.
          #
          # These test how the TRAINING DATA ITSELF is built, deduplicated, recovered and
          # split -- including split_protocol_v2, the gene-disjoint split on which every
          # leakage claim in this project rests. The one stage of the pipeline where a silent
          # error contaminates EVERY downstream result is the stage the gate never checked.
          # That is also why the clean-clone breakage (ModuleNotFoundError, fixed 2026-07-11)
          # survived: nothing here had ever run on a runner that lacked the developer's disk.
          #
          # This is expected to go RED on first contact. That is the POINT: these files have
          # never met a clean runner (no gitignored cohort data, HF_HUB_OFFLINE=1, no network).
          # Failures are triaged into exactly two buckets -- a real bug, which is fixed, or a
          # genuine data dependency, which gets a REGISTERED marker with a printed reason.
          # No bare skips. A test that does not run must always say why (-rs, above).
          #
          # --assert-suite-size (2026-07-13, roadmap 6.14): THE SUITE-SIZE RATCHET.
          #
          # The G1 pre-flight gate carried a hand-maintained pytest floor. It rotted FIVE TIMES
          # IN TWO DAYS -- 1485 -> 1805 -> 1842 -> 1850 -> 1853 -- every time directly beneath
          # an all-capitals comment ordering the next person to raise it. At 1485 against a
          # suite passing 1,815, THREE HUNDRED AND THIRTY tests could have vanished and the gate
          # would still have said PASS. A COMMENT DOES NOT ENFORCE ITSELF.
          #
          # The number now lives in ONE file -- tests/EXPECTED_SUITE_SIZE -- and this flag makes
          # pytest ABORT if the COLLECTED count disagrees with it, in EITHER direction:
          #   fewer  -> tests have VANISHED (deleted, mis-named, lost to a collection error, or
          #             silently skipped at module import because a dependency went missing --
          #             which is EXACTLY how the graph-neural-network branch went untested for
          #             508 runs; see roadmap 6.17).
          #   more   -> tests were added and the ratchet was not bumped. Red until it is.
          #
          # Continuous Integration and G1 pass the same flag and read the same file, so the two
          # gates cannot drift apart. The COLLECTED count is asserted rather than `passed`,
          # because collected is environment-independent (1,870 on Windows and on this runner)
          # while the passed/skipped split legitimately is not.
          pytest tests/ -q \
            -rs \
            --tb=short \
            --assert-suite-size \
            --cov=genomic_variant_classifier \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # THE ISOLATED DRIFT ENVIRONMENT. (added 2026-07-13, roadmap 6.19)
  #
  # A SEPARATE job, with a SEPARATE dependency set, because the monitoring stack and the
  # model stack have IRRECONCILABLE pins:
  #
  #     nannyml   0.13.0 AND 0.13.1  require  lightgbm >=3.3,<4.6   -- we TRAIN on 4.6.0
  #     nannyml   0.13.0 AND 0.13.1  require  plotly   >=5.6,<6.0   -- we run     6.6.0
  #     evidently 0.7.6  AND 0.7.21  require  plotly   <6           -- we run     6.6.0
  #
  # There is NO release of nannyml compatible with lightgbm 4.6.0 (verified by reading the
  # METADATA of both releases, 2026-07-13). LightGBM is a BASE MODEL of the ensemble.
  # Downgrading it to satisfy a MONITORING library would change the science to suit the
  # instrument. That trade is refused; the environments are separated instead.
  #
  # These tests CANNOT live in the main suite. Putting them in tests/ behind a module-level
  # `importorskip("nannyml")` would collapse N tests into ONE skip entry, making the COLLECTED
  # count environment-dependent -- which would silently break the suite-size ratchet (roadmap
  # 6.14), a guard whose premise only became true this morning when the dependency gap (6.17)
  # was closed. So: tests_drift/, a separate top-level directory OUTSIDE `testpaths`, enforced
  # by configuration rather than by a comment someone has to remember.
  #
  # WHAT THIS JOB PROTECTS: Confidence-Based Performance Estimation -- estimating the model's
  # ROC AUC on a NEW ClinVar release BEFORE the labels exist. requirements.in has claimed that
  # capability since 2026-05. Until today it had NEVER BEEN BUILT: nannyml was imported by
  # exactly one file, a script that printed its version number.
  # ─────────────────────────────────────────────────────────────────────────
  drift:
    name: drift monitor (isolated env)
    runs-on: ubuntu-latest
    # `needs: lockfile-check` REMOVED 2026-07-14 (roadmap 6.25). This job installs
    # requirements-drift.txt into a DELIBERATELY ISOLATED environment -- the whole point of it
    # is that it shares nothing with the API image. Chaining it behind the API lockfile gate
    # was gratuitous, and on run 29374485597 it meant a spurious lockfile failure skipped the
    # drift tests too. A gate should fail the thing it protects, not everything downstream.
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the ISOLATED drift environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-drift.txt
          # --no-deps: the project's TRAINING dependencies (torch, torch_geometric, pyspark,
          # lightgbm 4.6.0) must NOT come along. pyspark in particular would KILL nannyml:
          # pyspark 3.5.x's pandas module calls np.NaN, REMOVED in NumPy 2.0, and nannyml
          # OPTIONALLY imports pyspark. That is why `import nannyml` has never worked on the
          # developer's laptop.
          pip install -e . --no-deps
          pip install pytest packaging

      - name: Assert the isolation actually holds
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata as md
          import sys

          MUST_BE_ABSENT = {
              "pyspark": "nannyml optionally imports it; pyspark 3.5.x calls np.NaN, REMOVED "
                         "in NumPy 2.0 -- its mere PRESENCE kills `import nannyml`",
              "torch": "training-only; this environment must never unpickle a trained model",
              "torch_geometric": "training-only",
          }
          MUST_BE_PRESENT = ["nannyml", "evidently"]

          bad = 0
          for pkg, why in MUST_BE_ABSENT.items():
              try:
                  v = md.version(pkg)
                  print(f"  *** {pkg} {v} IS PRESENT AND MUST NOT BE: {why}")
                  bad += 1
              except md.PackageNotFoundError:
                  print(f"  OK  {pkg} absent")
          for pkg in MUST_BE_PRESENT:
              try:
                  print(f"  OK  {pkg} {md.version(pkg)}")
              except md.PackageNotFoundError:
                  print(f"  *** {pkg} IS MISSING -- the drift capability is silently gone")
                  bad += 1

          import importlib
          lgbm = importlib.import_module("lightgbm")
          print(f"  OK  lightgbm {lgbm.__version__} (must be <4.6; training uses 4.6.0)")
          if tuple(int(x) for x in lgbm.__version__.split(".")[:2]) >= (4, 6):
              print("  *** lightgbm >= 4.6 here -- nannyml cannot work. Isolation broken.")
              bad += 1

          sys.exit(1 if bad else 0)
          PY

      - name: pip check -- the isolated env must ALSO be conflict-free
        run: |
          set -euo pipefail
          pip check
          echo "drift env: no broken requirements."

      - name: Verify the drift stack reports itself honestly
        run: python scripts/verify_drift_libs.py

      - name: Run the drift tests
        run: pytest tests_drift/ -v -rs

  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    # THIS job genuinely depends on the lock -- Dockerfile:68-70 installs requirements-api.lock
    # into the image. Made EXPLICIT 2026-07-14 (roadmap 6.25): it used to inherit the
    # dependency transitively through `test`, which is why removing `test`'s spurious
    # `needs: lockfile-check` would otherwise have severed a REAL dependency by accident.
    #
    # The distinction is the whole point: pytest does not read this lock, and drift does not
    # read this lock, so neither should wait on it. The image DOES read it, so it waits.
    needs: [test, lockfile-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build API image
        run: |
          docker build \
            --target api \
            --tag genomic-variant-api:smoke \
            --file Dockerfile \
            .

      - name: Smoke-test container
        run: |
          docker run --detach \
            --name smoke-api \
            -p 8000:8000 \
            genomic-variant-api:smoke
          sleep 15
          curl --fail --silent http://localhost:8000/health | grep -q '"status"'
          docker rm -f smoke-api

  # ─────────────────────────────────────────────────────────────────────────
  push-ghcr:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Log in to GHCR
        # docker/login-action v4 -- runs.using: node24 (v3 was node20).
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        # docker/metadata-action v6.2.0 -- node24 (v5 was node20). Outputs
        # `tags` and `labels`, both still consumed below, are unchanged.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        # docker/build-push-action v7 -- node24. NOTE v6 is STILL node20, so the
        # obvious one-major bump would have resolved nothing while the commit
        # message claimed otherwise. Inputs context/file/target/push/tags/labels/
        # cache-from/cache-to were each confirmed present in v7's manifest.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max












